<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stellar Wallet Dashboard</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>💧 Stellar Wallet Dashboard</h1>
        </header>

        <main>
            <section class="wallet-section">
                <h2>Wallet</h2>
                <div class="input-group">
                    <label for="secret-key">Secret Key (or leave blank to generate new):</label>
                    <input type="password" id="secret-key" placeholder="S...">
                    <button id="toggle-secret">Show</button>
                </div>
                <div class="button-group">
                    <button id="load-wallet">Load Wallet</button>
                    <button id="generate-wallet">Generate New Wallet</button>
                </div>
                <div id="wallet-feedback" class="result-box hidden"></div>
                <div id="wallet-info" class="info-box hidden">
                    <p><strong>Public Key:</strong> <span id="public-key"></span></p>
                    <p><strong>Secret Key:</strong> <span id="secret-key-display"></span></p>
                </div>
            </section>

            <section class="balance-section">
                <div class="section-heading">
                    <h2>Balances</h2>
                    <button id="refresh-balances" class="icon-button" type="button" aria-label="Refresh balances">
                        <span class="refresh-icon" aria-hidden="true">↻</span>
                        <span class="refresh-label">Refresh</span>
                    </button>
                </div>
                <div id="balances" class="balances-container">
                    <p class="loading">Load a wallet to view balances</p>
                </div>
            </section>

            <section class="transaction-section">
                <h2>Send Payment</h2>
                <div class="input-group">
                    <label for="destination">Destination Address:</label>
                    <input type="text" id="destination" placeholder="G...">
                </div>
                <div class="input-group">
                    <label for="amount">Amount (XLM):</label>
                    <input type="number" id="amount" step="0.0000001" placeholder="0.0">
                </div>
                <button id="send-payment">Send Payment</button>
                <div id="transaction-result" class="result-box hidden"></div>
            </section>

            <section class="multisig-section">
                <h2>Multi-Signature</h2>
                <div id="multisig-info" class="info-box">
                    <p class="loading">Load a wallet to view multisig details</p>
                </div>

                <div class="input-group">
                    <label for="signer-public-key">Second Signer Public Key:</label>
                    <input type="text" id="signer-public-key" placeholder="G...">
                </div>
                <div class="input-group">
                    <label for="signer-weight">Signer Weight:</label>
                    <input type="number" id="signer-weight" min="0" max="255" step="1" value="1">
                </div>
                <button id="add-signer">Add or Update Signer</button>

                <div class="input-group multisig-signing">
                    <label for="transaction-xdr">Transaction XDR to Sign:</label>
                    <textarea id="transaction-xdr" rows="4" placeholder="AAAA..."></textarea>
                </div>
                <div class="input-group">
                    <label for="signer-secret-key">Signer Secret Key:</label>
                    <input type="password" id="signer-secret-key" placeholder="S...">
                </div>
                <button id="sign-transaction">Sign XDR</button>
                <div id="multisig-result" class="result-box hidden"></div>
            </section>

            <section class="network-section">
                <h2>Network</h2>
                <select id="network-select">
                    <option value="testnet">Testnet</option>
                    <option value="public">Public Mainnet</option>
                </select>
            </section>
        </main>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/stellar-sdk/11.0.1/stellar-sdk.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
